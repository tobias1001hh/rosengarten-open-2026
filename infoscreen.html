<title>Rosengarten Open Infoscreen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<style>
  /* Fester TV-Look: dunkles Navy, keine Theme-Umschaltung. */
  :root {
    --navy: #101C38;
    --navy2: #182A52;
    --ink: #F4F2EA;
    --muted: #9FAAC4;
    --red: #E14B57;
    --gold: #DCE43F;
    --ball: #D9E021;
    --line: #2C3A5E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%);
    color: var(--ink);
    font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  .layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 4vh 5vw 9vh;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .layer.sichtbar { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .layer { transition: none; } }

  .kopf { display: flex; align-items: baseline; gap: 2vw; margin-bottom: 3vh; }
  .kopf .eyebrow {
    font-family: "Montserrat", sans-serif; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 1.7vw; color: var(--red);
  }
  .kopf h2 {
    margin: 0; font-family: "Montserrat", sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: 4.2vw; letter-spacing: 0.02em; line-height: 1.05; color: #fff;
  }
  .inhalt { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

  /* Willkommen-Slide */
  .welcome { text-align: center; }
  .welcome .lockup { display: inline-block; background: #fff; border-radius: 1vw; padding: 2vh 2.2vw; }
  .welcome .lockup img { width: 30vw; display: block; }
  .welcome h1 { margin: 3.5vh 0 0; font-family: "Montserrat", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 5.6vw; line-height: 1.05; color: #fff; }
  .welcome .jub { margin-top: 1.6vh; text-transform: uppercase; letter-spacing: 0.12em; font-size: 2vw; color: var(--gold); font-weight: 700; }
  .welcome .datum { margin-top: 2vh; font-size: 2.4vw; color: var(--ink); }
  .welcome .countdown { margin-top: 3vh; font-family: "Montserrat", sans-serif; font-size: 3.2vw; color: var(--ball); font-variant-numeric: tabular-nums; }
  .welcome .news { margin-top: 3vh; font-size: 2vw; color: var(--muted); }

  /* Tabellen-Slides */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 1.1vh 1.2vw; text-align: left; border-bottom: 1px solid var(--line); font-size: 2.2vw; }
  th { font-family: "Montserrat", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1.5vw; color: var(--muted); }
  td.zeit, td.platz { white-space: nowrap; color: var(--muted); }
  td.zeit { color: var(--ink); font-weight: 600; }
  .paarung { font-weight: 600; }
  .erg { color: var(--ball); font-weight: 700; white-space: nowrap; }
  .konkR { color: var(--muted); font-size: 1.8vw; }
  .badge {
    font-family: "Montserrat", sans-serif; font-weight: 600; text-transform: uppercase;
    font-size: 1.4vw; letter-spacing: 0.08em; padding: 0.3vh 0.8vw; border-radius: 3px; white-space: nowrap;
  }
  .badge.laeuft { background: var(--red); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  .badge.geplant { border: 1px solid var(--line); color: var(--muted); }
  .badge.wo, .badge.verschoben { border: 1px solid var(--red); color: var(--red); }
  @keyframes pulse { 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .badge.laeuft { animation: none; } }

  .sieger-liste { display: grid; gap: 2vh; }
  .sieger-liste .zeile { display: flex; align-items: baseline; gap: 2vw; }
  .sieger-liste .k { font-family: "Montserrat", sans-serif; text-transform: uppercase; font-size: 2.4vw; color: var(--muted); min-width: 26vw; }
  .sieger-liste .n { font-size: 2.6vw; font-weight: 700; color: var(--gold); }

  .party-slide { text-align: center; }
  .party-slide .gross { font-family: "Montserrat", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 6vw; color: var(--gold); line-height: 1.1; }
  .party-slide p { font-size: 2.4vw; color: var(--ink); max-width: 60vw; margin: 3vh auto 0; }

  .fuss {
    position: absolute; left: 5vw; right: 5vw; bottom: 2.5vh;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.5vw; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 1.2vh;
  }
  .fuss .uhr { font-family: "Montserrat", sans-serif; font-size: 2vw; color: var(--ink); font-variant-numeric: tabular-nums; }
  .fuss img { height: 3.2vw; vertical-align: middle; border-radius: 50%; background: #fff; margin-right: 0.8vw; }
  .fuss .marke { display: flex; align-items: center; font-family: "Montserrat", sans-serif; text-transform: uppercase; letter-spacing: 0.1em; }
  .punkte { position: absolute; right: 5vw; top: 4.5vh; display: flex; gap: 0.6vw; }
  .punkte i { width: 0.9vw; height: 0.9vw; border-radius: 50%; background: var(--line); }
  .punkte i.aktiv { background: var(--ball); }
</style>

  function tabellenSlide(eyebrow, titel, zeilen) {

  function kopf(eyebrow, titel) {

  }
  function seiten(arr, n) {
    var out = [];
    for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

        })
        .catch(function () { /* offline: weiterlaufen */ });
    }, CHECK);
  }

  /* Sicherheitsnetz gegen Langzeit-Drift: einmal pro Nacht um 04:00 neu laden */
  (function planReload() {
    var jetzt = new Date(), ziel = new Date(jetzt);
    ziel.setHours(4, 0, 0, 0);
    if (ziel <= jetzt) ziel.setDate(ziel.getDate() + 1);
    setTimeout(function () { location.reload(); }, ziel - jetzt);
  })();

  zeigeNaechste();
})();
</script>
