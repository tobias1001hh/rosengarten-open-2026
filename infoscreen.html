<title>Rosengarten Open Infoscreen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  /* Fester TV-Look: dunkles Navy, keine Theme-Umschaltung. */
  :root {
    --navy: #101C38;
    --navy2: #182A52;
    --ink: #F4F2EA;
    --muted: #9FAAC4;
    --red: #E14B57;
    --gold: #C9A24B;
    --ball: #D9E021;
    --line: #2C3A5E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy2) 100%);
    color: var(--ink);
    font-family: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  .layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 4vh 5vw 9vh;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .layer.sichtbar { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .layer { transition: none; } }

  .kopf { display: flex; align-items: baseline; gap: 2vw; margin-bottom: 3vh; }
  .kopf .eyebrow {
    font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 1.7vw; color: var(--red);
  }
  .kopf h2 {
    margin: 0; font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase;
    font-size: 4.2vw; letter-spacing: 0.02em; line-height: 1.05; color: #fff;
  }
  .inhalt { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }

  /* Willkommen-Slide */
  .welcome { text-align: center; }
  .welcome img { width: 11vw; border-radius: 50%; background: #fff; }
  .welcome .club { font-family: "Oswald", sans-serif; letter-spacing: 0.25em; text-transform: uppercase; font-size: 1.5vw; color: var(--muted); margin-top: 2vh; }
  .welcome h1 { margin: 1vh 0 0; font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 7.2vw; line-height: 1; color: #fff; }
  .welcome .jub { margin-top: 1.6vh; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.12em; font-size: 2.2vw; color: var(--gold); font-weight: 600; }
  .welcome .jub .fifty { font-size: 3.4vw; font-weight: 700; }
  .welcome .datum { margin-top: 2vh; font-size: 2.4vw; color: var(--ink); }
  .welcome .countdown { margin-top: 3vh; font-family: "Oswald", sans-serif; font-size: 3.2vw; color: var(--ball); font-variant-numeric: tabular-nums; }
  .welcome .news { margin-top: 3vh; font-size: 2vw; color: var(--muted); }

  /* Tabellen-Slides */
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { padding: 1.1vh 1.2vw; text-align: left; border-bottom: 1px solid var(--line); font-size: 2.2vw; }
  th { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; font-size: 1.5vw; color: var(--muted); }
  td.zeit, td.platz { white-space: nowrap; color: var(--muted); }
  td.zeit { color: var(--ink); font-weight: 600; }
  .paarung { font-weight: 600; }
  .erg { color: var(--ball); font-weight: 700; white-space: nowrap; }
  .konkR { color: var(--muted); font-size: 1.8vw; }
  .badge {
    font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase;
    font-size: 1.4vw; letter-spacing: 0.08em; padding: 0.3vh 0.8vw; border-radius: 3px; white-space: nowrap;
  }
  .badge.laeuft { background: var(--red); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
  .badge.geplant { border: 1px solid var(--line); color: var(--muted); }
  .badge.wo, .badge.verschoben { border: 1px solid var(--red); color: var(--red); }
  @keyframes pulse { 50% { opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { .badge.laeuft { animation: none; } }

  .sieger-liste { display: grid; gap: 2vh; }
  .sieger-liste .zeile { display: flex; align-items: baseline; gap: 2vw; }
  .sieger-liste .k { font-family: "Oswald", sans-serif; text-transform: uppercase; font-size: 2.4vw; color: var(--muted); min-width: 26vw; }
  .sieger-liste .n { font-size: 2.6vw; font-weight: 700; color: var(--gold); }

  .party-slide { text-align: center; }
  .party-slide .gross { font-family: "Oswald", sans-serif; font-weight: 700; text-transform: uppercase; font-size: 6vw; color: var(--gold); line-height: 1.1; }
  .party-slide p { font-size: 2.4vw; color: var(--ink); max-width: 60vw; margin: 3vh auto 0; }

  .fuss {
    position: absolute; left: 5vw; right: 5vw; bottom: 2.5vh;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 1.5vw; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 1.2vh;
  }
  .fuss .uhr { font-family: "Oswald", sans-serif; font-size: 2vw; color: var(--ink); font-variant-numeric: tabular-nums; }
  .fuss img { height: 3.2vw; vertical-align: middle; border-radius: 50%; background: #fff; margin-right: 0.8vw; }
  .fuss .marke { display: flex; align-items: center; font-family: "Oswald", sans-serif; text-transform: uppercase; letter-spacing: 0.1em; }
  .punkte { position: absolute; right: 5vw; top: 4.5vh; display: flex; gap: 0.6vw; }
  .punkte i { width: 0.9vw; height: 0.9vw; border-radius: 50%; background: var(--line); }
  .punkte i.aktiv { background: var(--ball); }
</style>

    }

    if (D.phase === "ausgelost") {
      var erste = D.matches.filter(function (m) { return m.termin; })
        .sort(function (a, b) { return a.termin.localeCompare(b.termin); }).slice(0, MAX_ZEILEN);
      if (erste.length) slides.push(tabellenSlide("Die Auslosung ist erfolgt", "Erste Ansetzungen", erste.map(function (m) { return matchZeile(m, true); })));
      else slides.push({ html: kopf("15. September 2026", "Die Auslosung ist erfolgt") + "<div class='inhalt welcome'><div class='datum'>Tableaus und Spielplan: auf der Turnierseite und am Aushang.</div></div>" });
    }

    if (vorTurnier) {
      slides.push(tabellenSlide("Turnierwoche", "Programm", [
        "<tr><td class='zeit'>Fr. 18.09.</td><td>ab 18:00</td><td class='paarung'>Vorrunden (bei Bedarf)</td><td></td></tr>",
        "<tr><td class='zeit'>Sa./So. 19./20.09.</td><td>ab 09:00</td><td class='paarung'>Vorrunden</td><td></td></tr>",
        "<tr><td class='zeit'>Fr. 25.09.</td><td>ab 18:00</td><td class='paarung'>Vorrunden / Halbfinals</td><td></td></tr>",
        "<tr><td class='zeit'>Sa. 26.09.</td><td>ab 09:00</td><td class='paarung'>Halbfinals · Finals Doppel &amp; Mixed · Jubiläumsparty</td><td></td></tr>",
        "<tr><td class='zeit'>So. 27.09.</td><td>ab 13:00</td><td class='paarung'>Finals Einzel &amp; B-Runden</td><td></td></tr>"
      ]));
      var kz = D.konkurrenzen.map(function (k) {
        return "<tr><td class='paarung'>" + esc(k.name) + "</td><td>" + esc(k.meldungen) +
          (String(k.meldungen).indexOf("Team") < 0 ? " Meldungen" : "") + "</td></tr>";
      });
      if (kz.length) slides.push(tabellenSlide("Es wird gespielt", "Konkurrenzen", kz));
    }

    if (jetzt < new Date("2026-09-27T00:00:00")) {
      slides.push({ html: kopf("Samstag, 26.09.2026", "Jubiläumsparty") +
        "<div class='inhalt party-slide'><div><div class='gross'>50 Jahre<br>Tennis in Vahrendorf</div>" +
        "<p>Gefeiert wird auf der Anlage — direkt nach den Finals im Doppel und Mixed. Alle Vereine im Rosengarten sind herzlich eingeladen!</p></div></div>" });
    }
    return slides;
  }

  /* ---------- Rotation über zwei Layer ---------- */
  var layers = [document.getElementById("layerA"), document.getElementById("layerB")];
  var aktivLayer = 0, slideNr = -1, slides = buildSlides();
  var punkte = document.getElementById("punkte");

  function zeigeNaechste() {
    slideNr++;
    if (slideNr >= slides.length) { slides = buildSlides(); slideNr = 0; }
    var alt = layers[aktivLayer];
    aktivLayer = 1 - aktivLayer;
    var neu = layers[aktivLayer];
    neu.innerHTML = slides[slideNr].html;
    neu.classList.add("sichtbar");
    alt.classList.remove("sichtbar");
    punkte.innerHTML = slides.map(function (_, i) { return "<i" + (i === slideNr ? " class='aktiv'" : "") + "></i>"; }).join("");
    /* Burn-in: Fuß minimal versetzen */
    document.getElementById("fuss").style.transform = "translateY(" + ((slideNr % 3) - 1) + "px)";
    setTimeout(zeigeNaechste, DAUER);
  }

  /* ---------- Uhr, Countdown, Nacht-Reload ---------- */
  function tick() {
    var jetzt = new Date();
    document.getElementById("uhr").textContent =
      jetzt.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    var cd = document.getElementById("countdown");
    if (cd) {
      var diff = TURNIERSTART - jetzt;
      if (diff > 0) {
        var t = Math.floor(diff / 86400000), h = Math.floor(diff % 86400000 / 3600000),
            m = Math.floor(diff % 3600000 / 60000), s = Math.floor(diff % 60000 / 1000);
        cd.textContent = "Turnierstart in " + (t > 0 ? t + (t === 1 ? " Tag " : " Tagen ") : "") +
          String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      } else cd.textContent = "Es geht los!";
    }
  }
  setInterval(tick, 1000);
  tick();

  if (D.stand) {
    var sd = new Date(D.stand);
    document.getElementById("stand").textContent = "Stand: " +
      sd.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + ", " +
      sd.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
  }

  /* Auto-Update: alle 5 Minuten den eigenen Quelltext vom Server holen und den
     "stand"-Zeitstempel vergleichen. Neu geladen wird nur, wenn der Download
     geklappt hat UND ein neuer Stand da ist — bei Netzausfall laeuft der Screen
     einfach weiter. (Auf file:// deaktiviert.) */
  if (location.protocol !== "file:") {
    setInterval(function () {
      fetch(location.href, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (t) {
          if (!t) return;
          var m = /stand:\s*"([^"]*)"/.exec(t);
          if (m && m[1] && m[1] !== D.stand) location.reload();
        })
        .catch(function () { /* offline: weiterlaufen */ });
    }, 5 * 60 * 1000);
  }

  /* Sicherheitsnetz gegen Langzeit-Drift: einmal pro Nacht um 04:00 neu laden */
  (function planReload() {
    var jetzt = new Date(), ziel = new Date(jetzt);
    ziel.setHours(4, 0, 0, 0);
    if (ziel <= jetzt) ziel.setDate(ziel.getDate() + 1);
    setTimeout(function () { location.reload(); }, ziel - jetzt);
  })();

  zeigeNaechste();
})();
</script>
